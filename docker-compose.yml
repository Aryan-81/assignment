services:
  api:
    build: .
    container_name: ssl_checker_api

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    depends_on:
      - postgres

    env_file:
      - .env

  postgres:
    image: postgres:16
    container_name: ssl_checker_db

    restart: always

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: