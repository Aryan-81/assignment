services:
  test_db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ssl_checker_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  test_runner:
    build: .
    volumes:
      - .:/app
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ssl_checker_test
      POSTGRES_HOST: test_db
      POSTGRES_PORT: 5432
      PYTHONPATH: .
    depends_on:
      test_db:
        condition: service_healthy
    command: ["sh", "-c", "chmod +x scripts/run_tests.sh && ./scripts/run_tests.sh"]
